# Sample Nginx Configuration for Video Voice Translator

server {
    listen 80;
    server_name localhost;

    # Maximum upload size for videos
    client_max_body_size 500M;

    # Frontend (Vite Build or Dev Server)
    location / {
        # Uncomment for Vite Dev Server:
        proxy_pass http://localhost:3000;
        
        # Uncomment for Production Build:
        # root /path/to/video-voice-translator/frontend/dist;
        # index index.html;
        # try_files $uri $uri/ /index.html;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api/ {
        proxy_pass http://localhost:8000;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (if needed for FastAPI)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
