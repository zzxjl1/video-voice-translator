# Nginx configuration for Video Voice Translator.
#
# One origin serves two things:
#     /       -> the built frontend (frontend/dist), as static files
#     /api/   -> the FastAPI backend on 127.0.0.1:9100
#
# Serving the build instead of proxying the Vite dev server is the whole point
# of this file. The dev server compiles on demand, keeps file watchers open,
# serves unbundled modules and source maps, and depends on a Node process
# surviving every deploy — development aids, not a delivery format.
#
# Deploying:
#     cd frontend && npm ci && npm run build
#     rsync -a --delete frontend/dist/ server:/var/www/video-voice-translator/
#     ssh server 'nginx -t && systemctl reload nginx'
#
# The `nginx -t` is not optional. A config that fails to parse makes `reload`
# fail, and the old workers keep running whatever was loaded before — so a
# broken edit is invisible until the next restart.

server {
    listen 80;
    server_name video-voice-translator.idealbroker.cn 119.45.51.201;

    # Video uploads. Without this, nginx rejects anything over its 1 MB default
    # with 413 before the request reaches the backend.
    client_max_body_size 500M;

    root /var/www/video-voice-translator;
    index index.html;

    # nginx compresses only text/html unless told otherwise, and the largest
    # asset here is not HTML. Measured sizes:
    #
    #     ort-wasm-simd-threaded.jsep-*.wasm   27.0 MB ->  6.3 MB
    #     index-*.js (first paint)             304 KB  ->  95 KB
    #     index-*.css                           41 KB  ->   7 KB
    #
    # `application/wasm` is the one that matters most: without it the ONNX
    # runtime is downloaded uncompressed, and that is 20.7 MB of avoidable
    # transfer on the first use of in-browser separation.
    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/css
        text/plain
        application/javascript
        application/json
        application/wasm
        image/svg+xml;

    # Serve pre-compressed `.gz` twins when they exist, falling back to
    # compressing on the fly when they do not.
    #
    # Compressing a 27 MB .wasm costs a second of CPU and a chunk of memory on
    # every new visitor. The files are content-hashed and cached for a year, so
    # each visitor pays it once — but they arrive in bursts. Producing the twins
    # at build time moves that cost off the request path entirely:
    #
    #     find dist -type f \( -name '*.js' -o -name '*.css' -o -name '*.wasm' \) \
    #       -exec gzip -6 -k {} \;
    #
    # Harmless without them: `gzip on` above still applies.
    gzip_static on;

    # ---------------------------------------------------------------- static

    # Vite gives every file in here a content hash, so a cached copy can never
    # be stale — a changed file gets a new name. `immutable` also stops the
    # revalidation request the browser would otherwise waste.
    location /assets/ {
        # A missing asset must 404, NOT fall back to index.html.
        #
        # With the SPA fallback below, a wrong path answers 200 text/html, and
        # the real failure surfaces somewhere else entirely. That has already
        # cost time in this project: the ONNX runtime's .wasm was being served
        # as HTML and the console said "Expected 'application/wasm'". A clean
        # 404 names the problem; an HTML response hides it.
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # application/wasm is missing from older mime.types files, and the ONNX
    # runtime refuses to instantiate with any other content type. Scoped to
    # .wasm so replacing the type map here cannot affect anything else. The file
    # is dist/assets/ort-wasm-simd-threaded.jsep-<hash>.wasm.
    location ~* \.wasm$ {
        types {
            application/wasm wasm;
        }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html is the one file that must never be cached: it is what names the
    # hashed assets. A stale copy points at files the next build deleted, and
    # the app opens to a blank page with 404s in the console.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Everything else: the file if it exists, otherwise the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ------------------------------------------------------------------- api

    location /api/ {
        # No trailing slash on purpose. `proxy_pass http://127.0.0.1:9100/` (with
        # one) replaces the matched `/api/` prefix, so the backend would receive
        # `/videos/...` instead of `/api/videos/...` and every route would 404.
        proxy_pass http://127.0.0.1:9100;

        proxy_http_version 1.1;

        # Progress logs stream out of the backend while the pipeline runs, and
        # the browser reads them with `response.body.getReader()`.
        #
        # nginx buffers proxied responses by default, which would hold that
        # stream until it finished — the log would arrive in one lump at the end,
        # which is the opposite of what a progress log is for. The read timeout
        # is what keeps a slow ASR/LLM/TTS step, which can be silent for minutes
        # between events, from being cut off mid-run.
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        # Deliberately no `Upgrade`/`Connection: upgrade` headers here.
        #
        # Nothing in this app uses WebSocket — the live log is a plain streamed
        # HTTP response, which is why `proxy_buffering off` above is what it
        # needs. Announcing an upgrade handshake on every API call is at best
        # meaningless and at worst misleads the upstream.

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
